name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # "22" keeps the existing required check names and runs the minimum supported release.
        node: ["22", "24"]
        include:
          - node: "22"
            node-version: 22.13.0
          - node: "24"
            node-version: "24"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      - run: npm run test:install
      - run: npm run test:release
      - name: Verify generated checks leave the checkout clean
        run: git diff --exit-code
