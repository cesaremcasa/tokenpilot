name: Bug report
description: Report a reproducible TokenPilot problem without provider or project content.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include prompts, responses, code, credentials, account details, raw provider logs, or a TokenPilot database. Security issues belong in a private security advisory.
  - type: input
    id: version
    attributes:
      label: TokenPilot version
      placeholder: "0.4.11"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Linux
        - WSL (experimental)
        - Windows native (unsupported)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.23.1"
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider CLI and version
      placeholder: "Codex 0.146.1"
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Use only content-free diagnostics from `tokenpilot doctor` or the diagnostics report.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Replace task content and paths with synthetic placeholders.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed prompts, responses, code, paths, credentials, account identifiers, and raw provider output.
          required: true
